schema: spec-driven

# 项目上下文：只写 Agent 无法通过读代码推断出来的约束。
context: |
  这是一个纯 Windows 的单机徽章图片处理工具（koutu），面向不写代码的操作人员：
  把徽章照片处理成可付印的排版页——抠图（原图 → 底图）→ 去水印（底图 → 无水印）→ 排版（底图 + 排版demo.png → 已排版）。

  自 2026-10-06 起正在按提案 python-pyqt-rewrite 完全重写：单程序、三功能页签（PyQt6）
  + CLI 子命令（cutout / layout / watermark），交付 PyInstaller 单目录绿色包；
  旧实现（C# / PowerShell / 旧 Python）已整体归档 legacy/（只读参考、不参与验收）。

  所有 OpenSpec 产物（proposal / specs / design / tasks）与代码注释、界面文案一律用中文书写。

  无法从代码推断的硬约束：
  - 仅 Windows；实现是 Python 3.12 + PyQt6 / numpy / Pillow，正式实现只有 koutu/ 一份（单实现），
    双实现同步义务已终止。
  - 中文目录名（原图 / 原图_去水印 / doubao / 底图 / 无水印 / 无水印_AI重绘 / 无水印_精修 /
    无水印_细纹轻 / 无水印_细纹重 / 无水印底图 / 去水印_预览 / 已排版 / 水印诊断）
    是写给操作者的文件接口，属于不可重命名契约；新程序自动流程只读写 原图 → 底图 → 无水印 → 已排版。
  - 所有入口以「程序根」为根：打包版 = exe 所在目录；源码版 = 仓库根。
    整个目录必须能拷到别的电脑直接运行，不写死绝对路径。
  - 去水印为确定性、离线、alpha 不动；AI 路线（ComfyUI / 豆包 / 在线服务）是明确非目标。
  - 验收 = 对照 golden/ 金标准（像素级指标 + 日志统计行，容差见 docs/验收清单.md）
    + pytest 回归；旧去水印输出不作数（指标由研究波次定稿后写入 docs/验收清单.md 阶段 3）。
  - 行为对照禁止逐字节 SHA（旧文件编码层不同），一律走像素级指标。

# 逐产物规则
rules:
  proposal:
    - 说明改动落在哪条路线（抠图 / 去水印 / 排版 / 流程契约），以及是否需要挂 golden 对照或补 pytest 用例
    - 若会改动目录契约、输出文件名或默认参数，必须显式标注为破坏性变更并给出迁移方式
    - 明确写出非目标（不做什么），避免方案蔓延
  specs:
    - 每个 Requirement 至少配一个 Scenario，用 WHEN / THEN / AND 描述可观察行为
    - 数值必须与验收装置一致（阈值、迭代次数、容差、尺寸），不要写概括性描述；
      容差唯一来源是 docs/验收清单.md 与各能力规格
  design:
    - 仅在跨模块、跨路线或调整算法参数时编写；单点改动不写
  tasks:
    - 每条任务不超过半天；涉及行为变更的任务要写明对应的 golden 对照或 pytest 用例
    - 每一波最后必须有一条「实际运行受影响的入口并核对日志统计行」的验证任务

# 逐操作指引
operations:
  apply:
    guidance:
      - 改完必须跑 `.venv\Scripts\python.exe -m pytest tests -q` 并实跑受影响的入口
        （GUI 或 CLI），贴出日志统计行作为证据
      - 无法运行的检查项要明确说出来，不要用"应该没问题"代替验证
  archive:
    guidance:
      - 归档前确认 openspec/specs/ 已同步、`openspec validate --strict --all` 全绿、golden 对照通过
