schema: spec-driven

# 项目上下文：只写 Agent 无法通过读代码推断出来的约束。
context: |
  这是一个纯 Windows 的单机徽章图片批处理工具集，流程为：
  抠图（原图 → 底图）→ 去水印（底图 → 无水印系列）→ 排版（底图 + 排版demo.png → 已排版）。
  使用者是不写代码的操作人员，双击 exe / .bat 就要能用。

  所有 OpenSpec 产物（proposal / specs / design / tasks）与代码注释、界面文案一律用中文书写。

  无法从代码推断的硬约束：
  - 运行环境只有 Windows + .NET Framework 4.x；不要提跨平台方案，也不要引入包管理、
    构建系统或测试框架——exe 用系统自带 csc.exe 现场编译。
  - 抠图算法同时存在于 抠图工具.cs（编译为 徽章抠图.exe）与 cut_badge.ps1（Add-Type 内联 C#）；
    排版算法同时存在于 排版工具.cs（排版工具.exe）与 layout.ps1。任何算法改动必须同步两条实现。
  - 中文目录名（原图 / 底图 / 无水印 / 无水印_细纹轻 / 无水印_细纹重 / 无水印底图 / 已排版 / doubao）
    既是脚本之间的接口，也是写给操作者的文件接口，属于不可重命名契约。
  - 所有入口以自身所在目录为根（$PSScriptRoot / os.path.dirname(__file__) /
    AppDomain.CurrentDomain.BaseDirectory），整个目录必须能拷到别的电脑直接运行。
  - 去水印默认走确定性路线（detex.py 细纹压制、remove_watermark.py 点阵精确扣除），
    AI 重绘（本地 ComfyUI）与在线豆包属于可选路线，其不可用不得影响确定性路线。
  - 没有自动化测试与 CI。验收靠日志统计行（运行日志.txt / 排版日志.txt / _layout_log.txt）
    以及辅助探针脚本（_analyze.ps1 / _probe_demo.ps1 / scan_watermark.ps1 / ocr.ps1）。

# 逐产物规则
rules:
  proposal:
    - 说明改动落在哪条路线（抠图 / 去水印 / 排版 / 流程契约），以及是否需要同步双实现
    - 若会改动目录契约、输出文件名或默认参数，必须显式标注为破坏性变更并给出迁移方式
    - 明确写出非目标（不做什么），避免方案蔓延
  specs:
    - 每个 Requirement 至少配一个 Scenario，用 WHEN / THEN / AND 描述可观察行为
    - 数值必须与源码一致（阈值、迭代次数、容差、尺寸），不要写概括性描述
  design:
    - 仅在跨脚本、跨路线或调整算法参数时编写；单点改动不写
  tasks:
    - 每条任务不超过半天；涉及双实现的改动要把「同步另一侧实现」单列成一条任务
    - 最后必须有一条「实际运行受影响的脚本并核对日志」的验证任务

# 逐操作指引
operations:
  apply:
    guidance:
      - 本仓库没有测试可跑，改完必须实际运行受影响的脚本或 .bat，并贴出日志统计行作为证据
      - 无法运行的检查项要明确说出来，不要用"应该没问题"代替验证
  archive:
    guidance:
      - 归档前确认 openspec/specs/ 已同步，且抠图 / 排版的另一侧实现也已同步
